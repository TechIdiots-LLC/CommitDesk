name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release-check:
    name: Check if version is already released
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Get version and check GitHub releases
        id: check
        run: |
          VERSION=$(grep -oP '<ApplicationDisplayVersion>\K[^<]+' CommitDesk/CommitDesk.csproj | head -1)

          if echo "$VERSION" | grep -q -- '-'; then
            RELEASE_TYPE="prerelease"
          else
            RELEASE_TYPE="regular"
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}")

          if [ "$HTTP_STATUS" = "200" ]; then
            PUBLISHED="true"
          else
            PUBLISHED="false"
          fi

          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED"       >> "$GITHUB_OUTPUT"
          echo "release_type=$RELEASE_TYPE" >> "$GITHUB_OUTPUT"
          echo "VERSION: $VERSION"
          echo "RELEASE_TYPE: $RELEASE_TYPE"
          echo "PUBLISHED: $PUBLISHED"

    outputs:
      published:    ${{ steps.check.outputs.published }}
      version:      ${{ steps.check.outputs.version }}
      release_type: ${{ steps.check.outputs.release_type }}

  test:
    name: Core tests
    runs-on: windows-latest
    needs: release-check
    if: ${{ needs.release-check.outputs.published == 'false' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test CommitDesk.Core.Tests/CommitDesk.Core.Tests.csproj -c Release

  build-windows:
    name: Build Windows release (${{ matrix.rid }})
    runs-on: windows-latest
    needs: [release-check, test]
    if: ${{ needs.release-check.outputs.published == 'false' }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore workloads
        run: dotnet workload restore CommitDesk.sln

      - name: Publish ${{ matrix.rid }}
        # See ci.yml for the reasoning behind each switch.
        run: |
          dotnet publish CommitDesk/CommitDesk.csproj `
            -f net10.0-windows10.0.19041.0 `
            -c Release `
            -r ${{ matrix.rid }} `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:UseMonoRuntime=false `
            -p:WindowsAppSDKSelfContained=true `
            --output ./publish/${{ matrix.rid }}

      - name: Sign app (${{ matrix.rid }})
        # Skipped with a warning when the SIG_PFX secret isn't set
        shell: pwsh
        env:
          SIG_PFX_B64: ${{ secrets.SIG_PFX }}
          SIG_PFX_PASS: ${{ secrets.SIG_PFX_PASS }}
        run: ./build/Sign-Files.ps1 -Path "./publish/${{ matrix.rid }}/CommitDesk.exe"

      - name: Package release artifact (${{ matrix.rid }})
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "./publish/${{ matrix.rid }}/*" `
            -DestinationPath "./CommitDesk-v${{ needs.release-check.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Build installer (${{ matrix.rid }})
        # NSIS installer (Start Menu shortcut, uninstaller) alongside the portable zip; build/ is shared with GitLab.
        shell: pwsh
        env:
          SIG_PFX_B64: ${{ secrets.SIG_PFX }}
          SIG_PFX_PASS: ${{ secrets.SIG_PFX_PASS }}
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }
          $setup = "./CommitDesk-v${{ needs.release-check.outputs.version }}-${{ matrix.rid }}-setup.exe"
          ./build/Build-Installer.ps1 -SourceDir "./publish/${{ matrix.rid }}" -AppName "CommitDesk" -AppExe CommitDesk.exe `
            -Version "${{ needs.release-check.outputs.version }}" -Arch ("${{ matrix.rid }}" -replace '^win-', '') `
            -Icon "./publish/${{ matrix.rid }}/CommitDesk.ico" -OutFile $setup
          ./build/Sign-Files.ps1 -Path $setup

      - name: Upload build artifact (${{ matrix.rid }})
        uses: actions/upload-artifact@v7
        with:
          name: release-artifact-windows-${{ matrix.rid }}
          path: |
            CommitDesk-v${{ needs.release-check.outputs.version }}-${{ matrix.rid }}.zip
            CommitDesk-v${{ needs.release-check.outputs.version }}-${{ matrix.rid }}-setup.exe
          retention-days: 7

  build-android:
    name: Build Android release (preview)
    runs-on: windows-latest
    needs: [release-check, test]
    if: ${{ needs.release-check.outputs.published == 'false' }}
    environment: release
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      # Releases must be signed with the fixed keystore: without one .NET Android silently uses a random debug key,
      # and users could not upgrade in place. Android is a preview (no git on phones), so a missing keystore leaves
      # the APK out of the release instead of failing it.
      - name: Check for release keystore
        id: keystore
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)) {
            Write-Output "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release will not include an Android APK."
            "present=false" >> $env:GITHUB_OUTPUT
          } else {
            "present=true" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v7
        if: steps.keystore.outputs.present == 'true'

      - name: Set up .NET 10
        if: steps.keystore.outputs.present == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        if: steps.keystore.outputs.present == 'true'
        run: |
          dotnet workload restore CommitDesk.sln
          dotnet restore CommitDesk.sln

      - name: Decode release keystore
        if: steps.keystore.outputs.present == 'true'
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'commitdesk-release.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_B64))
          echo "ANDROID_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV

      - name: Check keystore, password and alias
        # Says which one is wrong, instead of jarsigner's bare "exited with code 1"; never prints a secret
        if: steps.keystore.outputs.present == 'true'
        shell: pwsh
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./build/Test-AndroidKeystore.ps1 -Keystore $env:ANDROID_KEYSTORE_PATH -StorePassword $env:KEYSTORE_PASS -Alias $env:KEY_ALIAS -KeyPassword $env:KEY_PASS

      - name: Publish Android APK (universal)
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # The key password defaults to the keystore password; set ANDROID_KEY_PASSWORD only if they differ.
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish CommitDesk/CommitDesk.csproj `
            -f net10.0-android36.0 `
            -c Release `
            -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:ANDROID_KEYSTORE_PATH" `
            -p:AndroidSigningStorePass="$env:KEYSTORE_PASS" `
            -p:AndroidSigningKeyAlias="$env:KEY_ALIAS" `
            -p:AndroidSigningKeyPass="$env:KEY_PASS" `
            --output ./publish/android

      - name: Rename APK to release filename
        if: steps.keystore.outputs.present == 'true'
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path "./publish/android" -Filter "*-Signed.apk" -Recurse | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path "./publish/android" -Filter "*.apk" -Recurse | Select-Object -First 1
          }
          if (-not $apk) { throw "No APK found under ./publish/android" }
          Copy-Item $apk.FullName -Destination "./CommitDesk-v${{ needs.release-check.outputs.version }}-android-preview.apk"

      - name: Upload build artifact
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-artifact-android
          path: CommitDesk-v${{ needs.release-check.outputs.version }}-android-preview.apk
          retention-days: 7

  build-macos:
    name: Build macOS release
    runs-on: macos-26
    needs: [release-check, test]
    if: ${{ needs.release-check.outputs.published == 'false' }}
    environment: release
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.4xx'

      - name: Restore workloads
        # Pinned workload set: 10.0.401.1 moved the Apple SDKs to 27.0, which require Xcode 27, and GitHub only has
        # Xcode 27 as a beta (the xcode-27 preview image). 10.0.401 builds with Xcode 26.6. Drop the pin (and the
        # SDK band above) once macos-26 ships a stable Xcode 27. The version must match the SDK band (10.0.4xx).
        run: dotnet workload restore CommitDesk.sln --version 10.0.401

      - name: Select the newest stable Xcode
        # See ci.yml
        run: |
          for XCODE in $(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' \
                         | grep -vi beta | sort -Vr); do
            if [ -d "$XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" ]; then
              echo "Selecting $XCODE"
              sudo xcode-select -s "$XCODE"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::error::No Xcode with a macOS SDK found under /Applications"
          exit 1

      - name: Import Developer ID certificate
        # Optional: without these secrets the app is ad-hoc signed and users right-click > Open it the first time.
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build and package
        env:
          MACOS_SIGNING_IDENTITY: ${{ env.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash build/build-macos.sh "v${{ needs.release-check.outputs.version }}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-artifact-macos
          path: CommitDesk-v${{ needs.release-check.outputs.version }}-macos.dmg
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release-check, build-windows, build-android, build-macos]
    if: ${{ needs.release-check.outputs.published == 'false' }}
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifact-*
          path: ./artifacts
          merge-multiple: true

      - name: Extract changelog for version
        run: |
          VERSION="${{ needs.release-check.outputs.version }}"
          awk -v ver="## $VERSION" \
            'BEGIN{p=0} $0==ver{p=1; next} /^## / && p==1{exit} p==1{print}' \
            CHANGELOG.md > changelog_for_version.md
          echo "--- Release notes ---"
          cat changelog_for_version.md
          echo "--- Files ---"
          ls -la ./artifacts

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag:        v${{ needs.release-check.outputs.version }}
          name:       CommitDesk v${{ needs.release-check.outputs.version }}
          bodyFile:   changelog_for_version.md
          # Every file the build jobs produced: Windows zips + installers, the macOS .dmg, and the Android APK when a
          # keystore is configured.
          artifacts:  ./artifacts/*
          prerelease: ${{ needs.release-check.outputs.release_type != 'regular' }}
          allowUpdates: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
