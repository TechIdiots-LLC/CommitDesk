name: Publish to Google Play

# Run by hand (Actions › Publish to Google Play › Run workflow) after a release: builds an Android App Bundle signed
# with the release keystore (Play's upload key) and releases it on the chosen track. Same job as GitLab's publish-play.
# Manual only: nothing reaches Google Play unless someone starts it. Uploads with the PLAY_SERVICE_ACCOUNT_JSON secret (the key
# file's JSON as is); without it the signed bundle is only kept as an artifact, for a first upload by hand. Needs the
# ANDROID_KEYSTORE_* secrets in the "release" environment; see docs/maintainers.md.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: 'Release status (draft: finish the release in Play Console)'
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: play-store
  cancel-in-progress: false

jobs:
  publish-play:
    name: Publish to Google Play
    runs-on: windows-latest
    environment: release
    env:
      # Without it the bundle is still built and kept, for the first release (uploaded by hand in Play Console)
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content CommitDesk/CommitDesk.csproj
          $version = ($csproj.Project.PropertyGroup.ApplicationDisplayVersion | Where-Object { $_ } | Select-Object -First 1).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Restore
        run: |
          dotnet workload restore CommitDesk.sln
          dotnet restore CommitDesk.sln

      - name: Decode and check the release keystore
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_B64)) { throw 'ANDROID_KEYSTORE_BASE64 is not set: Play bundles must be signed with the upload key.' }
          $path = Join-Path $env:RUNNER_TEMP 'commitdesk-play.keystore'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_B64))
          echo "ANDROID_KEYSTORE_PATH=$path" >> $env:GITHUB_ENV
          ./build/Test-AndroidKeystore.ps1 -Keystore $path -StorePassword $env:KEYSTORE_PASS -Alias $env:KEY_ALIAS -KeyPassword $env:KEY_PASS

      - name: Build the Android App Bundle
        # Play takes App Bundles (.aab), not APKs; ApplicationVersion is the versionCode and must rise with every upload
        shell: pwsh
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish CommitDesk/CommitDesk.csproj -f net10.0-android36.0 -c Release `
            -p:PlayStore=true -p:AndroidPackageFormat=aab -p:AndroidKeyStore=true `
            -p:AndroidSigningKeyStore="$env:ANDROID_KEYSTORE_PATH" -p:AndroidSigningStorePass="$env:KEYSTORE_PASS" `
            -p:AndroidSigningKeyAlias="$env:KEY_ALIAS" -p:AndroidSigningKeyPass="$env:KEY_PASS" `
            --output ./publish/play
          $aab = Get-ChildItem ./publish/play -Filter *-Signed.aab -Recurse | Select-Object -First 1
          if (-not $aab) { $aab = Get-ChildItem ./publish/play -Filter *.aab -Recurse | Select-Object -First 1 }
          if (-not $aab) { throw 'No .aab found under ./publish/play' }
          New-Item -ItemType Directory play-files -Force | Out-Null
          Copy-Item $aab.FullName "./play-files/CommitDesk-v${{ steps.version.outputs.version }}.aab"

      - name: Keep the bundle
        # The very first upload of an app has to be done by hand in Play Console
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: play-bundle
          path: play-files/
          retention-days: 30

      - name: No Play key, so no upload
        if: env.PLAY_SERVICE_ACCOUNT_JSON == ''
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set, so nothing was uploaded to Google Play. Download the play-bundle artifact to upload the .aab in Play Console."

      - name: Upload to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        run: |
          python -m pip install --quiet --disable-pip-version-check google-api-python-client google-auth
          python build/publish-play.py --aab "play-files/CommitDesk-v${{ steps.version.outputs.version }}.aab" --version "${{ steps.version.outputs.version }}" --track "${{ inputs.track }}" --status "${{ inputs.status }}"
