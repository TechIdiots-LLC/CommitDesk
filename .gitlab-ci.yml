# GitLab Desktop CI on the Windows shell runner (tag "windows"). GitLab ignores the GitHub workflows in .github/.
#
#   test                    Merge requests and pushes to main: run GitLabDesktop.Core.Tests (needs git on the runner).
#   ci-windows, ci-android  Merge requests and pushes to main: publish the Windows app (win-x64, win-arm64) and a
#                           debug-signed Android APK as job artifacts (7 days).
#   ci-macos                Same, for the macOS .dmg (universal: Apple silicon and Intel), on the runner tagged "macos";
#                           MACOS_RUNNER "false" skips it
#   release-*               Push to main: if no GitLab release exists for <ApplicationDisplayVersion>, publish the
#                           Windows zips and NSIS installers (build/installer.nsi), the Android APK (only when a release
#                           keystore is configured) and the macOS .dmg (only with a macOS runner), and create the release
#                           with the CHANGELOG.md notes. Releases wait for the tests.
#   publish-play            Manual (▶) on a release pipeline: build an Android App Bundle and release it on Google Play
#                           (track PLAY_TRACK, default internal).
#   bump-version            Build > Pipelines > New pipeline with BUMP_VERSION set: bump the version and changelog,
#                           push release-v<version> and open a merge request.
#
# Android is a preview: the app installs, but phones have no git command line, so repository operations don't work.
#
# CI/CD variables (Settings > CI/CD > Variables), Protected + Masked, environment scope "signing/main":
#   CI_PUSH_TOKEN              Project access token, role Maintainer, scopes api + write_repository (bump-version only)
#   ANDROID_KEYSTORE_BASE64    Optional: base64 of the release keystore; without it the release has no Android APK
#   ANDROID_KEYSTORE_PASSWORD  Keystore password (also used as the key password)
#   ANDROID_KEY_ALIAS          Key alias
#   ANDROID_KEY_PASSWORD       Optional: key password, only if it differs from the keystore password
#   SIG_PFX_B64, SIG_PFX_PASS  Optional: Windows code-signing .pfx (base64) and password; without them the Windows exe
#                              and installers are published unsigned, with a warning
#   PLAY_SERVICE_ACCOUNT_JSON_BASE64
#                              Optional: base64 of a Google Play service account key, for the manual publish-play job
#                              (Android App Bundle to Google Play, track internal by default; see docs/maintainers.md)
#   MACOS_RUNNER               Optional, not secret: "false" to skip the macOS jobs (default "true", set below)
#   MACOS_SIGNING_IDENTITY, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#                              Optional: sign and notarize the macOS app (see build/build-macos.sh); the identity must
#                              already be in the macOS runner's keychain

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid a duplicate branch pipeline while a merge request is open for the branch
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  BUMP_VERSION:
    value: "none"
    options: ["none", "patch", "minor", "major", "prepatch", "preminor", "premajor", "prerelease"]
    description: "Version bump type. Leave as 'none' to just build and release the current version."
  BUMP_PREID:
    value: "rc"
    description: "Prerelease identifier for the pre* bump types (e.g. alpha, beta, rc)."
  # The macOS jobs need a runner tagged "macos" (build/build-macos.sh; see the gitlab-runner-install project). Set the
  # project variable MACOS_RUNNER to "false" to skip them while no such runner is online, or the jobs wait for one.
  MACOS_RUNNER:
    value: "true"
    description: "Build the macOS app on the runner tagged macos ('false' to skip it)."

default:
  tags: [windows]

stages:
  - check
  - build
  - release

# Jobs that sign or push run in this environment; scope the protected variables to it.
.signing-environment: &signing-environment
  name: signing/$CI_COMMIT_BRANCH
  action: prepare

.ci-rules: &ci-rules
  - if: $BUMP_VERSION != "none"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.release-rules: &release-rules
  - if: $BUMP_VERSION != "none"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.test-rules: &test-rules
  - if: $BUMP_VERSION != "none"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.macos-ci-rules: &macos-ci-rules
  - if: $MACOS_RUNNER != "true" || $BUMP_VERSION != "none"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.macos-release-rules: &macos-release-rules
  - if: $MACOS_RUNNER != "true" || $BUMP_VERSION != "none"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rid-matrix: &rid-matrix
  - RID: [win-x64, win-arm64]

.version: &version
  - $version = ([regex]::Match((Get-Content GitLabDesktop/GitLabDesktop.csproj -Raw), '<ApplicationDisplayVersion>([^<]+)')).Groups[1].Value

# Windows publish, shared by CI and release.
# -r with -p:UseMonoRuntime=false: this csproj also targets Android/iOS/Mac Catalyst, so an explicit RID otherwise makes
# NuGet look for a Mono runtime pack for the Windows head, which doesn't exist (NU1101). The RID is needed to
# cross-build win-arm64 on the x64 runner. No separate restore: publish does a RID-aware restore (NETSDK1112).
# --self-contained + WindowsAppSDKSelfContained bundle both runtimes. No PublishSingleFile: WinUI 3 doesn't support it.
.publish-windows: &publish-windows
  - dotnet workload restore GitLabDesktop.sln
  - dotnet publish GitLabDesktop/GitLabDesktop.csproj -f net10.0-windows10.0.19041.0 -c Release -r $env:RID
      --self-contained true -p:WindowsPackageType=None -p:UseMonoRuntime=false -p:WindowsAppSDKSelfContained=true
      --output ./publish/$env:RID

# ── Tests ───────────────────────────────────────────────────────────────────────────────────────────

test:
  stage: check
  rules: *test-rules
  script:
    # The tests create throwaway repositories with the git CLI
    - git --version
    - dotnet test GitLabDesktop.Core.Tests/GitLabDesktop.Core.Tests.csproj -c Release --logger "junit;LogFilePath=$env:CI_PROJECT_DIR/test-results.xml"
  artifacts:
    when: always
    reports:
      junit: test-results.xml

# ── CI ──────────────────────────────────────────────────────────────────────────────────────────────

ci-windows:
  stage: build
  rules: *ci-rules
  parallel:
    matrix: *rid-matrix
  script:
    - *publish-windows
    - *version
    - Compress-Archive -Path "./publish/$env:RID/*" -DestinationPath "./GitLabDesktop-v$version-ci$env:CI_PIPELINE_IID-$env:CI_COMMIT_SHORT_SHA-$env:RID.zip"
  artifacts:
    name: ci-app-windows-$RID
    paths:
      - GitLabDesktop-*.zip
    expire_in: 7 days

ci-android:
  stage: build
  rules: *ci-rules
  script:
    - dotnet workload restore GitLabDesktop.sln
    - dotnet restore GitLabDesktop.sln
    # Not release-signed: .NET Android falls back to a debug key that differs per run, so this APK installs on a
    # clean device but won't upgrade a release install. No -r: one universal APK with android-arm64 + android-x64.
    - dotnet publish GitLabDesktop/GitLabDesktop.csproj -f net10.0-android36.0 -c Release --output ./publish/android
    - $apk = Get-ChildItem ./publish/android -Filter *-Signed.apk -Recurse | Select-Object -First 1
    - if (-not $apk) { $apk = Get-ChildItem ./publish/android -Filter *.apk -Recurse | Select-Object -First 1 }
    - if (-not $apk) { throw 'No APK found under ./publish/android' }
    - *version
    - Copy-Item $apk.FullName "./GitLabDesktop-v$version-ci$env:CI_PIPELINE_IID-$env:CI_COMMIT_SHORT_SHA-android-debug-signed.apk"
  artifacts:
    name: ci-app-android
    paths:
      - GitLabDesktop-*.apk
    expire_in: 7 days

# The .NET SDK band and workload set the macOS builds use, as in the GitHub workflows: 10.0.401.1 moved the Apple SDKs
# to 27.0, which require Xcode 27. 10.0.401 builds for the Mac Catalyst 26.0 SDK with Xcode 26. Raise both together
# once the runner has a stable Xcode 27; the workload set must match the SDK band.
# dotnet-workload-env (from gitlab-runner-install) gives these pins a .NET install of their own, so CI and release jobs
# or other projects on the same Mac can run at once without changing each other's workloads. Without it, the runner's
# shared ~/.dotnet is used, with a global.json written by the job only (Windows and local builds are not affected).
.macos-dotnet:
  before_script:
    - |
      # A release that already exists skips the build (in script:), so don't set anything up for it
      if [ "${RELEASE_PUBLISHED:-}" = "true" ]; then
        echo "Release already exists; nothing to set up."
      elif command -v dotnet-workload-env > /dev/null; then
        eval "$(dotnet-workload-env --sdk 10.0.4xx --workload-set 10.0.401)"
        dotnet --version
      else
        if ! dotnet --list-sdks | grep -q '^10\.0\.4[0-9][0-9] '; then
          echo "Installing the .NET SDK 10.0.4xx band"
          curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0.4xx --install-dir "${DOTNET_ROOT:-$HOME/.dotnet}" --no-path
        fi
        echo '{ "sdk": { "version": "10.0.400", "rollForward": "latestPatch" } }' > global.json
        dotnet --version
        dotnet workload restore GitLabDesktop.sln --version 10.0.401
      fi

ci-macos:
  stage: build
  tags: [macos]
  rules: *macos-ci-rules
  extends: .macos-dotnet
  script:
    - VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' GitLabDesktop/GitLabDesktop.csproj | head -1)
    # CI builds are never signed with the release identity
    - env -u MACOS_SIGNING_IDENTITY bash build/build-macos.sh "v$VERSION-ci$CI_PIPELINE_IID-$CI_COMMIT_SHORT_SHA" .
  artifacts:
    name: ci-app-macos
    paths:
      - GitLabDesktop-*.dmg
    expire_in: 7 days

# ── Release ─────────────────────────────────────────────────────────────────────────────────────────

release-check:
  stage: check
  rules: *release-rules
  script:
    - ./.gitlab/scripts/release-check.ps1 -Project GitLabDesktop/GitLabDesktop.csproj -Element ApplicationDisplayVersion
  artifacts:
    reports:
      dotenv: release.env

release-windows:
  stage: build
  rules: *release-rules
  needs: [release-check, test]
  environment: *signing-environment
  parallel:
    matrix: *rid-matrix
  script:
    - if ($env:RELEASE_PUBLISHED -eq 'true') { Write-Host "Release $env:RELEASE_TAG already exists; skipping."; exit 0 }
    - *publish-windows
    # Signs only the app's own exe (the runtime's createdump/RestartAgent are already Microsoft-signed); skipped with a
    # warning when SIG_PFX_B64 isn't set
    - ./build/Sign-Files.ps1 -Path ./publish/$env:RID/GitLabDesktop.exe
    - New-Item -ItemType Directory release-files -Force | Out-Null
    - Compress-Archive -Path "./publish/$env:RID/*" -DestinationPath "./release-files/GitLabDesktop-v$env:RELEASE_VERSION-$env:RID.zip"
    # NSIS installer (Start Menu shortcut, uninstaller) alongside the portable zip
    - $setup = "./release-files/GitLabDesktop-v$env:RELEASE_VERSION-$env:RID-setup.exe"
    - ./build/Build-Installer.ps1 -SourceDir ./publish/$env:RID -AppName "GitLab Desktop" -AppExe GitLabDesktop.exe
        -Version $env:RELEASE_VERSION -Arch ($env:RID -replace '^win-', '') -Icon ./publish/$env:RID/GitLabDesktop.ico -OutFile $setup
    - ./build/Sign-Files.ps1 -Path $setup
  artifacts:
    paths:
      - release-files/
    expire_in: 7 days

release-android:
  stage: build
  rules: *release-rules
  needs: [release-check, test]
  environment: *signing-environment
  script:
    - if ($env:RELEASE_PUBLISHED -eq 'true') { Write-Host "Release $env:RELEASE_TAG already exists; skipping."; exit 0 }
    # Releases must be signed with the fixed release keystore: without one .NET Android silently uses a random debug
    # key, so users couldn't upgrade in place. Android is a preview, so a missing keystore skips it rather than
    # failing the whole release.
    - if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) { Write-Warning 'ANDROID_KEYSTORE_BASE64 is not set; the release will not include an Android APK.'; exit 0 }
    - $keystore = Join-Path ([IO.Path]::GetTempPath()) "gitlabdesktop-release-$env:CI_JOB_ID.keystore"
    - '[IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))'
    # The key password defaults to the keystore password; set ANDROID_KEY_PASSWORD only if they differ
    - $keyPassword = if ($env:ANDROID_KEY_PASSWORD) { $env:ANDROID_KEY_PASSWORD } else { $env:ANDROID_KEYSTORE_PASSWORD }
    # Say which of keystore / password / alias / key password is wrong, instead of jarsigner's bare "exited with code 1"
    - ./build/Test-AndroidKeystore.ps1 -Keystore $keystore -StorePassword $env:ANDROID_KEYSTORE_PASSWORD -Alias $env:ANDROID_KEY_ALIAS -KeyPassword $keyPassword
    - dotnet workload restore GitLabDesktop.sln
    - dotnet restore GitLabDesktop.sln
    - dotnet publish GitLabDesktop/GitLabDesktop.csproj -f net10.0-android36.0 -c Release -p:AndroidKeyStore=true
        "-p:AndroidSigningKeyStore=$keystore" "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD"
        "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS" "-p:AndroidSigningKeyPass=$keyPassword"
        --output ./publish/android
    - $apk = Get-ChildItem ./publish/android -Filter *-Signed.apk -Recurse | Select-Object -First 1
    - if (-not $apk) { $apk = Get-ChildItem ./publish/android -Filter *.apk -Recurse | Select-Object -First 1 }
    - if (-not $apk) { throw 'No APK found under ./publish/android' }
    - New-Item -ItemType Directory release-files -Force | Out-Null
    - Copy-Item $apk.FullName "./release-files/GitLabDesktop-v$env:RELEASE_VERSION-android-preview.apk"
  after_script:
    - Remove-Item (Join-Path ([IO.Path]::GetTempPath()) "gitlabdesktop-release-$env:CI_JOB_ID.keystore") -Force -ErrorAction SilentlyContinue
  artifacts:
    paths:
      - release-files/
    expire_in: 7 days

release-macos:
  stage: build
  tags: [macos]
  rules: *macos-release-rules
  extends: .macos-dotnet
  needs: [release-check, test]
  environment: *signing-environment
  script:
    - if [ "$RELEASE_PUBLISHED" = "true" ]; then echo "Release $RELEASE_TAG already exists; skipping."; exit 0; fi
    - bash build/build-macos.sh "v$RELEASE_VERSION" release-files
  artifacts:
    paths:
      - release-files/
    expire_in: 7 days

release-publish:
  stage: release
  rules: *release-rules
  needs:
    - release-check
    - release-windows
    - release-android
    - job: release-macos
      optional: true
  resource_group: release
  script:
    - ./.gitlab/scripts/publish-release.ps1 -PackageName gitlabdesktop -ReleaseName "GitLab Desktop"

# Google Play: run by hand (the ▶ button) on a release pipeline. Builds an Android App Bundle signed with the release
# keystore (Play's upload key) and releases it on PLAY_TRACK (default internal). The .aab is kept as an artifact: the
# very first upload of an app has to be done by hand in Play Console. See docs/maintainers.md.
publish-play:
  stage: release
  rules:
    - if: $BUMP_VERSION != "none"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  needs: [release-check, test]
  environment: *signing-environment
  resource_group: play-store
  variables:
    PLAY_TRACK: "internal"           # internal, alpha (closed testing), beta (open testing) or production
    PLAY_RELEASE_STATUS: "completed" # or "draft" to review and roll out in Play Console
  script:
    - if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) { throw 'ANDROID_KEYSTORE_BASE64 is not set; Play bundles must be signed with the upload key.' }
    - $keystore = Join-Path ([IO.Path]::GetTempPath()) "gitlabdesktop-play-$env:CI_JOB_ID.keystore"
    - '[IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))'
    - $keyPassword = if ($env:ANDROID_KEY_PASSWORD) { $env:ANDROID_KEY_PASSWORD } else { $env:ANDROID_KEYSTORE_PASSWORD }
    - ./build/Test-AndroidKeystore.ps1 -Keystore $keystore -StorePassword $env:ANDROID_KEYSTORE_PASSWORD -Alias $env:ANDROID_KEY_ALIAS -KeyPassword $keyPassword
    - dotnet workload restore GitLabDesktop.sln
    - dotnet restore GitLabDesktop.sln
    # Play takes App Bundles (.aab), not APKs; ApplicationVersion is the versionCode and must rise with every upload
    - dotnet publish GitLabDesktop/GitLabDesktop.csproj -f net10.0-android36.0 -c Release -p:AndroidPackageFormat=aab
        -p:AndroidKeyStore=true "-p:AndroidSigningKeyStore=$keystore" "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD"
        "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS" "-p:AndroidSigningKeyPass=$keyPassword"
        --output ./publish/play
    - $aab = Get-ChildItem ./publish/play -Filter *-Signed.aab -Recurse | Select-Object -First 1
    - if (-not $aab) { $aab = Get-ChildItem ./publish/play -Filter *.aab -Recurse | Select-Object -First 1 }
    - if (-not $aab) { throw 'No .aab found under ./publish/play' }
    - New-Item -ItemType Directory play-files -Force | Out-Null
    - Copy-Item $aab.FullName "./play-files/GitLabDesktop-v$env:RELEASE_VERSION.aab"
    # Without the Play key the bundle is still built and kept, for the first release (uploaded by hand in Play Console)
    - if ([string]::IsNullOrWhiteSpace($env:PLAY_SERVICE_ACCOUNT_JSON_BASE64)) { Write-Warning 'PLAY_SERVICE_ACCOUNT_JSON_BASE64 is not set, so nothing was uploaded to Google Play. Download the .aab from this job''s artifacts to upload it in Play Console.'; exit 0 }
    - python -m pip install --quiet --disable-pip-version-check google-api-python-client google-auth
    - python build/publish-play.py --aab "./play-files/GitLabDesktop-v$env:RELEASE_VERSION.aab" --version $env:RELEASE_VERSION --track $env:PLAY_TRACK --status $env:PLAY_RELEASE_STATUS
  after_script:
    - Remove-Item (Join-Path ([IO.Path]::GetTempPath()) "gitlabdesktop-play-$env:CI_JOB_ID.keystore") -Force -ErrorAction SilentlyContinue
  artifacts:
    when: always
    paths:
      - play-files/
    expire_in: 30 days

# Run by hand (the ▶ button on a main pipeline) to test the Android signing variables without making a release.
android-keystore-check:
  stage: check
  rules:
    - if: $BUMP_VERSION != "none"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  environment: *signing-environment
  script:
    - if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) { throw 'ANDROID_KEYSTORE_BASE64 is not available to this job (check the variable and its environment scope, signing/main).' }
    - $keystore = Join-Path ([IO.Path]::GetTempPath()) "gitlabdesktop-check-$env:CI_JOB_ID.keystore"
    - '[IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))'
    - $keyPassword = if ($env:ANDROID_KEY_PASSWORD) { $env:ANDROID_KEY_PASSWORD } else { $env:ANDROID_KEYSTORE_PASSWORD }
    - ./build/Test-AndroidKeystore.ps1 -Keystore $keystore -StorePassword $env:ANDROID_KEYSTORE_PASSWORD -Alias $env:ANDROID_KEY_ALIAS -KeyPassword $keyPassword
  after_script:
    - Remove-Item (Join-Path ([IO.Path]::GetTempPath()) "gitlabdesktop-check-$env:CI_JOB_ID.keystore") -Force -ErrorAction SilentlyContinue

# ── Version bump ────────────────────────────────────────────────────────────────────────────────────

bump-version:
  stage: build
  resource_group: bump-version
  environment: *signing-environment
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $BUMP_VERSION != "none"
  variables:
    GIT_DEPTH: 0   # full history: the changelog lists merge requests since the last tag
  script:
    - ./.gitlab/scripts/bump.ps1 -BumpType $env:BUMP_VERSION -PreId $env:BUMP_PREID
